<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><meta name="description" content="Pete 個人中心，個人專案入口"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icons/icon-192.png"><link rel="apple-touch-icon" href="./icons/icon-192.png"><title>Pete 個人中心</title><style>:root{color-scheme:dark;--bg:#0b1220;--panel:#172235;--line:#2a3b54;--text:#f2f7ff;--muted:#9eb0c8;--accent:#69d5bc}*{box-sizing:border-box}body{margin:0;font-family:system-ui,'Noto Sans TC',sans-serif;background:radial-gradient(circle at top right,#1b3554,transparent 50%),var(--bg);color:var(--text);min-height:100dvh}main{max-width:940px;margin:auto;padding:38px 22px 90px}header{display:flex;align-items:center;gap:17px;margin-bottom:35px}.brand{width:64px;height:64px;display:grid;place-items:center;background:linear-gradient(135deg,#4bd2b4,#4085c6);color:#081524;border-radius:18px;font-size:27px;font-weight:900}h1{margin:0;font-size:clamp(26px,5vw,36px)}.hint{color:var(--muted);margin:7px 0 0}.top{display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}.status{font-size:13px;color:var(--muted);margin:0 0 22px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}.tile{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px;min-height:200px;display:flex;flex-direction:column;align-items:flex-start}.symbol{font-size:34px;margin-bottom:16px}h2{font-size:19px;margin:0 0 8px}.desc{color:var(--muted);font-size:14px;line-height:1.6;margin:0 0 22px}.open{display:inline-flex;align-items:center;justify-content:center;min-height:42px;text-decoration:none;border-radius:11px;padding:10px 17px;background:var(--accent);color:#071b21;font-size:14px;font-weight:800;margin-top:auto}button{border:1px solid var(--line);color:var(--text);background:#243652;border-radius:11px;padding:11px 14px;cursor:pointer}section{margin-top:35px}section h2{font-size:19px}.panel{background:#121d2f;border:1px solid var(--line);padding:19px;border-radius:16px}.panel p,footer{font-size:13px;color:var(--muted);line-height:1.7}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}input{width:100%;background:#0b1422;color:white;border:1px solid #3b4d66;border-radius:9px;padding:13px;font-size:15px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.small{font-size:12px;color:var(--muted)}.delete{margin-left:8px;font-size:12px;background:transparent;padding:7px 9px}footer{margin-top:44px;border-top:1px solid var(--line);padding-top:18px}@media(max-width:570px){main{padding:25px 16px 80px}.formgrid{grid-template-columns:1fr}}</style></head><body><main><header><div class="brand" aria-hidden="true">P</div><div><h1>Pete 個人中心</h1><p class="hint">一個入口，開啟所有個人專案</p></div></header><div class="top"><p class="status" id="status">正在檢查連線狀態…</p><button id="install" hidden>安裝到裝置</button></div><div class="grid" id="sites"></div><section><h2>新增個人專案</h2><div class="panel"><p>新增的捷徑只保存在這台裝置。要同步到其他裝置，請更新 sites.json 並重新發布。</p><form id="addForm"><div class="formgrid"><input id="name" maxlength="50" required placeholder="網站名稱" aria-label="網站名稱"><input id="url" required type="url" placeholder="https://網站網址" aria-label="HTTPS 網址"></div><div class="actions"><button type="submit">新增網站捷徑</button><button type="button" id="check">檢查入口更新</button></div></form><p id="msg" role="status" aria-live="polite"></p></div></section><footer>此 App 是網站入口，原網站會在新分頁開啟。原網站的內容、登入、學習紀錄及同步機制仍由原網站管理。</footer></main><script src="./app.js" defer></script></body></html>
